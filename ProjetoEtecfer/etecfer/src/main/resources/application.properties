spring.application.name=etecfer

# Banco temporário para testes, sem precisar instalar PostgreSQL
spring.datasource.url=jdbc:h2:mem:etecfer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Criar as tabelas ao iniciar e apagá-las ao encerrar
spring.jpa.hibernate.ddl-auto=create-drop

# não formatar os comandos SQL no console
spring.jpa.properties.hibernate.format_sql=false

# Moatrar os comandos SQL no console 
spring.jpa.show-sql=true

# Configurar a porta do servidor 
server.port=8080
