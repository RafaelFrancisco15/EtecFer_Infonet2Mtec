<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de cursos</title>
</head>
<body>
    <h1 style="text-align: center;">Lista de cursos</h1>
    <h3 style="text-align: center;">
        <a th:href="@{/cursos/criar}">Novo curso</a>
    </h3>

    <table border="1" align="center">
        <tr>
            <th>Nome</th>
            <th>Período</th>
            <th>Carga horária</th>
            <th>Ações</th>
        </tr>
        <tr th:each="curso : ${cursos}">
            <td th:text="${curso.nomeCurso}">#</td>
            <td th:text="${curso.periodoCurso}">#</td>
            <td th:text="${curso.chCurso}">#</td>
            <td>
                <a th:href="@{/cursos/editar/{id}(id=${curso.idCurso})}">Editar</a>
                <a th:href="@{/cursos/excluir/{id}(id=${curso.idCurso})}">Excluir</a>
            </td>
        </tr>
    </table>

    <p style="text-align: center;"><a th:href="@{/}">Página inicial</a></p>
</body>
</html>
