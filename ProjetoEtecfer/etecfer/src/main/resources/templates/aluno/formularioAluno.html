<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de aluno</title>
</head>
<body>
     <h1 style="text-align: center;"> Cadastrar aluno</h1>

      <form th:action="@{/alunos/salvar}" method="post" th:object="${aluno}">
        <input type="hidden" th:field="*{idAluno}">
        <label for="">Nome:</label>
        <input type="text" th:field="*{nomeAluno}">
        <br/>

        <label for="">E-mail:</label>
        <input type="text" th:field="*{emailAluno}">
        <br/>
        
          <label for="">Telefone:</label>
        <input type="text" th:field="*{emailAluno}">
        <br/>

          <label for="">RA:</label>
        <input type="text" th:field="*{emailAluno}">
        <br/>

          <label for="">CPF</label>
        <input type="text" th:field="*{emailAluno}">
        <br/>
        <input type="submit" value="Salvar"/>

        <h1>lista</h1>

      </form>
</body>
</html>
