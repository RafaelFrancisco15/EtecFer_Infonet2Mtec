<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de aluno</title>
</head>
<body>
    <h1 style="text-align: center;">Cadastrar aluno</h1>

    <form th:action="@{/alunos/salvar}" method="post" th:object="${aluno}" enctype="multipart/form-data">
        <input type="hidden" th:field="*{idAluno}">

        <label>Nome:</label>
        <input type="text" th:field="*{nomeAluno}" required maxlength="40">
        <br>

        <label>E-mail:</label>
        <input type="email" th:field="*{emailAluno}" maxlength="40">
        <br>

        <label>Telefone:</label>
        <input type="text" th:field="*{telefoneAluno}" required maxlength="11">
        <br>

        <label>RA:</label>
        <input type="number" th:field="*{raAluno}" required>
        <br>

        <label>CPF:</label>
        <input type="text" th:field="*{cpfAluno}" required maxlength="11">
        <br>

        <label for="curso">Curso:</label>
        <select th:field="*{curso}" id="curso" required>
            <option value="">Selecione um curso</option>
            <option th:each="curso : ${cursos}"
                    th:value="${curso.idCurso}"
                    th:text="${curso.nomeCurso}">
            </option>
        </select>
        <br>

        <label for="foto">Foto:</label>
        <input type="file" id="foto" name="foto" accept="image/*">
        <br>

        <input type="submit" value="Salvar">
        <a th:href="@{/alunos/listar}">Voltar</a>
    </form>
</body>
</html>
