<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de disciplina</title>
</head>
<body>
    <h1 style="text-align: center;">Cadastrar disciplina</h1>

    <form th:action="@{/disciplinas/salvar}" method="post" th:object="${disciplina}">
        <input type="hidden" th:field="*{idDisciplina}">

        <label>Nome:</label>
        <input type="text" th:field="*{nomeDisciplina}" required maxlength="40">
        <br>

        <label>Sigla:</label>
        <input type="text" th:field="*{siglaDisciplina}" required>
        <br>

        <label>Carga horária:</label>
        <input type="number" th:field="*{cargahDisciplina}" required min="1">
        <br>

        <label for="curso">Curso:</label>
        <select th:field="*{curso}" id="curso" required>
            <option value="">Selecione um curso</option>
            <option th:each="curso : ${cursos}"
                    th:value="${curso.idCurso}"
                    th:text="${curso.nomeCurso}">
            </option>
        </select>
        <br>

        <label for="professor">Professor:</label>
        <select th:field="*{professor}" id="professor" required>
            <option value="">Selecione um professor</option>
            <option th:each="professor : ${professores}"
                    th:value="${professor.idProfessor}"
                    th:text="${professor.nomeProfessor}">
            </option>
        </select>
        <br>

        <input type="submit" value="Salvar">
        <a th:href="@{/disciplinas/listar}">Voltar</a>
    </form>
</body>
</html>
